<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather MCP Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg0: #0b1c2c;
      --bg1: #14324a;
      --ink: #f4f7fb;
      --muted: #b7c7d6;
      --accent: #3db8a6;
      --warn: #e6b35a;
      --danger: #e07a5f;
      --ok: #7dcea0;
      --line: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(61,184,166,0.25), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(224,122,95,0.18), transparent 55%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }
    .brand {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(2rem, 4vw, 2.8rem);
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    .lede {
      color: var(--muted);
      margin: 0 0 28px;
      max-width: 42rem;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    input, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 10px 14px;
      background: rgba(255,255,255,0.06);
      color: var(--ink);
    }
    input#location { flex: 1; min-width: 220px; }
    input#days { width: 88px; }
    button {
      background: var(--accent);
      color: #062018;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    h2 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.25rem;
      margin: 28px 0 12px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .card, #rec-card, table {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .card { padding: 16px; }
    .label { color: var(--muted); font-size: 0.85rem; }
    .value { font-size: 1.45rem; font-weight: 600; margin-top: 4px; }
    #rec-card { display: none; padding: 16px 18px; }
    #rec-card.yes { border-color: rgba(224,122,95,0.5); background: rgba(224,122,95,0.12); }
    #rec-card.maybe { border-color: rgba(230,179,90,0.5); background: rgba(230,179,90,0.12); }
    #rec-card.no { border-color: rgba(125,206,160,0.5); background: rgba(125,206,160,0.12); }
    table { width: 100%; border-collapse: collapse; overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 0.95rem; }
    th { color: var(--muted); font-weight: 600; }
    #error {
      display: none;
      color: #ffd0c6;
      background: rgba(224,122,95,0.15);
      border: 1px solid rgba(224,122,95,0.4);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">Weather MCP</h1>
    <p class="lede">Spot-check the same Open-Meteo data the Agent Bricks agent reads through the weather MCP tools.</p>

    <div class="controls">
      <input id="location" type="text" placeholder="City, e.g. Chicago, IL" value="{{ default_location }}">
      <label>Days <input id="days" type="number" min="1" max="16" value="5"></label>
      <button id="refresh" type="button">Look up</button>
    </div>

    <div id="error"></div>

    <h2>Current conditions</h2>
    <div class="cards">
      <div class="card"><div class="label">Temperature</div><div class="value" id="temp">—</div></div>
      <div class="card"><div class="label">Conditions</div><div class="value" id="conditions">—</div></div>
      <div class="card"><div class="label">Humidity</div><div class="value" id="humidity">—</div></div>
      <div class="card"><div class="label">Wind</div><div class="value" id="wind">—</div></div>
    </div>

    <h2>Travel recommendation</h2>
    <div id="rec-card">
      <div><strong id="rec-title">—</strong></div>
      <div id="rec-reason" style="color:var(--muted); margin-top:6px;"></div>
    </div>

    <h2>Forecast</h2>
    <table>
      <thead>
        <tr><th>Date</th><th>High</th><th>Low</th><th>Precip</th><th>Conditions</th></tr>
      </thead>
      <tbody id="forecast-body"></tbody>
    </table>
  </main>

  <script>
    const errorBox = document.getElementById('error');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }
    function clearError() {
      errorBox.style.display = 'none';
      errorBox.textContent = '';
    }
    async function fetchJson(url) {
      const resp = await fetch(url);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Request failed');
      return data;
    }
    async function refresh() {
      clearError();
      const location = encodeURIComponent(document.getElementById('location').value.trim());
      const days = document.getElementById('days').value || 5;
      try {
        const [current, forecast, rec] = await Promise.all([
          fetchJson(`/api/current?location=${location}`),
          fetchJson(`/api/forecast?location=${location}&days=${days}`),
          fetchJson(`/api/recommendation?location=${location}&date=tomorrow`),
        ]);
        document.getElementById('temp').textContent = `${current.temperature_f}°F`;
        document.getElementById('conditions').textContent = current.conditions;
        document.getElementById('humidity').textContent = `${current.humidity_pct}%`;
        document.getElementById('wind').textContent = `${current.wind_mph} mph`;

        const card = document.getElementById('rec-card');
        card.style.display = 'block';
        card.className = rec.umbrella_needed ? 'yes' : (rec.jacket !== 'none' ? 'maybe' : 'no');
        document.getElementById('rec-title').textContent = rec.recommendation;
        document.getElementById('rec-reason').textContent = rec.reasoning;

        const body = document.getElementById('forecast-body');
        body.innerHTML = '';
        for (const day of forecast.forecast) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${day.date}</td><td>${day.high_f}°F</td><td>${day.low_f}°F</td><td>${day.precip_chance_pct}%</td><td>${day.conditions}</td>`;
          body.appendChild(tr);
        }
      } catch (err) {
        showError(err.message || String(err));
      }
    }
    document.getElementById('refresh').addEventListener('click', refresh);
    refresh();
  </script>
</body>
</html>
